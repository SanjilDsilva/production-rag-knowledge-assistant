[project]
name = "production-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
