name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python
        run: uv python install 3.12

      - name: Cache pinned BGE model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: bge-small-en-v1.5-${{ runner.os }}-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - name: Install project dependencies
        run: uv sync --locked

      - name: Run unit tests
        env:
            PYTHONPATH: src
        run: uv run --no-sync python -m pytest tests/unit -q

      - name: Run retrieval regression gate
        env:
          PYTHONPATH: src
        run: uv run --no-sync python scripts/evaluate_retrieval_ci_fixture.py